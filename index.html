<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle do Motor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>CONTROLE DO MOTOR</h1>

    <p class="subtitle">
        Sistema de reversão • ESP32
    </p>

        <div class="status" id="status">
            <span class="status-light"></span>
            <span id="statusText">MOTOR PARADO</span>
        </div>

        <div class="motor-area" id="motorArea">

            <div class="motor-ring"></div>

            <div class="arrow"></div>

            <div class="motor-button">
                <div class="motor-icon">⚙</div>
                <div class="motor-text">MOTOR</div>
            </div>

        </div>

        <div class="controls">

            <button
                id="btnLigar"
                class="control-button activate">
                ACIONAR
            </button>

            <button
                id="btnParar"
                class="control-button stop">
                PARAR
            </button>

        </div>

    </main>

    <script type="module" src="script.js"></script>

</body>

</html>
